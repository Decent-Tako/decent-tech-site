name: Publish Storybook and the site preview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'design-system/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: design-system
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: design-system/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        env:
          # The public project site is served under /decent-tech-site/.
          STORYBOOK_BASE_PATH: /decent-tech-site/
        run: npm run storybook:build

      - name: Build the site bundle for the preview
        env:
          # The site preview of main is served under
          # /decent-tech-site/site-preview/, next to Storybook.
          SITE_BASE_PATH: /decent-tech-site/site-preview/
        run: npm run build:site

      - name: Assemble the site preview into the Pages artifact
        run: node scripts/build-site-preview.mjs --base /decent-tech-site/site-preview/ --out storybook-static/site-preview

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: design-system/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
