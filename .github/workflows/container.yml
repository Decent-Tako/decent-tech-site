name: Test and publish container

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v

  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One linux/amd64 image, loaded into the runner's Docker for the site
      # check below. The multi-platform push on main stays as it is.
      - name: Build the image for the site check
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: decent-tech-site:check

      - name: Build and publish the multi-platform image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/decent-tako/decent-tech-site:latest
            ghcr.io/decent-tako/decent-tech-site:sha-${{ github.sha }}

      - name: Run the container
        run: |
          docker run --detach --name site --publish 8080:8080 decent-tech-site:check
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 1
          done
          echo "The container did not answer /healthz in 30 s"
          docker logs site
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: design-system/package-lock.json

      - name: Install dependencies
        working-directory: design-system
        run: npm ci

      - name: Drop the Chrome apt source the runner image ships
        # Same reason as in design-system.yml: dl.google.com served a
        # hash-mismatched index on 2026-09-10, and playwright install
        # --with-deps refreshes every apt source.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources

      - name: Install Playwright Chromium
        working-directory: design-system
        run: npx playwright install --with-deps chromium

      - name: Check the site pages and scenes in Chromium
        working-directory: design-system
        run: node scripts/check-site.mjs http://127.0.0.1:8080/

      - name: Upload the site screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-shots
          path: design-system/site-shots/
          if-no-files-found: error

      - name: Stop the container
        if: always()
        run: docker rm --force site
